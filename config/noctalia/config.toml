# Noctalia reads every *.toml in ~/.config/noctalia/ and merges them.
# Settings changed in the GUI are saved to ~/.local/state/noctalia/settings.toml
# and take priority over this file.

[shell]
polkit_agent = true  # password prompts for apps that need admin rights

# Brightness for external monitors over DDC/CI (ddcutil). Laptop screens still
# use their built-in backlight; this only adds monitors that support DDC/CI.
[brightness]
enable_ddcutil = true

# Colour GTK, Qt, kitty, btop and Luciole to match Noctalia (same as Settings -> Templates).
# Run `noctalia theme --list-templates` to see the others.
[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "qt", "kitty", "btop", "luciole"]
