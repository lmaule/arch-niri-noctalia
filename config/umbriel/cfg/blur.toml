# ────────────── Blur ──────────────
# The installer leaves this file out of config.toml when run with --no-blur.
# https://docs.noctalia.dev/umbriel/appearance/ and Noctalia's Umbriel guide.

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# Blur behind every window (where it's see-through).
[[window_rule]]
blur = true

# Noctalia's bar, notifications, dock, panels, OSDs and desktop widgets.
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

# Panels, the dock, notifications and OSDs open over windows, so they blur the
# live content behind them (the bar and widgets keep the cheaper wallpaper blur).
[[layer_rule]]
match.namespace = "^noctalia-(notification|dock|panel|attached-panel|osd)$"
blur_optimized = false

# Noctalia's window switcher.
[[layer_rule]]
match.namespace = "^noctalia-window-switcher$"
blur = true
