# Desktop portal choices for Umbriel sessions (installed by install-umbrinoc.sh).
# Replaces Umbriel's packaged umbriel-portals.conf, so its default is repeated.
#
# Open/Save file dialogs in other apps use Luciole. GTK's dialog is only used
# if Luciole isn't installed. To go back to GTK's dialog, delete the
# FileChooser line, then log out and back in.
[preferred]
default=umbriel;gtk
org.freedesktop.impl.portal.FileChooser=luciole;gtk
